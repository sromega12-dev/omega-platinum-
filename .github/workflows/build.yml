name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Android template structure
        run: |
          flutter create . --org com.omega.platinum --project-name omega_platinum --platforms=android

      - name: Force Android SDK 35 in Gradle
        run: |
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' android/build.gradle || true
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 35/g' android/build.gradle || true
          echo "android.defaultConfig.targetSdkVersion=35" >> android/gradle.properties
          echo "android.defaultConfig.compileSdkVersion=35" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-platinum-apk
          path: build/app/outputs/flutter-apk/app-release.apk
