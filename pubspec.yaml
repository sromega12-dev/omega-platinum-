name: omega_platinum
description: "Omega Platinum - O guia supremo de caça a platinas na PSN com rank Omegod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase e Banco de Dados
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.8

  # Recursos visuais e sons
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36 # Para o som de conquista "Trophy Ding"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Caso utilize arquivos de áudio locais para o Trophy Ding
  assets:
    - assets/sounds/
